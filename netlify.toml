[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Direct all SPA routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable client assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
