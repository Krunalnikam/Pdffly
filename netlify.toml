[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# Direct all non-static asset routes to the Nitro Netlify function handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# Cache immutable client assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
